    retrieved_date: "2026-10-23"
    notes: "Columbus residents pay a total of 2.5%; 100% credit up to 2.5%."
  - evidence_id: "CMH-2026-SRC-2"
    source_name: "Columbus City Auditor 2026 Official Revenue Estimate (Oct 30, 2025)"
    url: "https://www.columbus.gov/files/sharedassets/city/v/2/city-auditor/news/2026-official-revenue-estimate-of-the-city-auditor.pdf"
