# =============================================================================
# Columbus - 2026 resident policy (single, age 40, lives and works in the city).
# Resident-only scope: nonresident rules are intentionally not encoded here.
# =============================================================================
jurisdiction_id: "US-OH-CMH"
tax_year: 2026
jurisdiction_type: "city"
jurisdiction_name: "Columbus"
parent_jurisdiction_id: "US-OH"
parent_state: "OH"
has_income_tax: true
tax_type: "municipal_income_tax"
applies_to: "residents_only"
effective_start_date: "2026-01-01"
effective_end_date: "2026-12-31"
rate_schedule:
  rate_type: "flat"
  tax_base: "earned_income"
  flat_rates:
    resident_rate: 0.025
local_config:
  special_notes:
    - "2.5% of qualifying wages; intangible income exempt under ORC 718.01(C)(2)."
    - "Assumes W-2 wages equal Ohio qualifying wages (Medicare wages)."
verification:
  status: "validated_cases_only"
  last_verified: "2026-10-23"
  verified_by: "2026 local source review"
  notes: "2026 single age-40 resident living and working in Columbus."
references:
