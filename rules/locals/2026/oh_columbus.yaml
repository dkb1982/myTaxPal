    url: "https://codes.ohio.gov/ohio-revised-code/section-718.01"
    retrieved_date: "2026-10-23"
    notes: "(C)(2)(a) intangible income (dividends, capital gains, interest) is exempt income; (R) qualifying wages. Retrieved via Wayback copy."
