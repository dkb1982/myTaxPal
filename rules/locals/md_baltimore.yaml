# =============================================================================
# Baltimore City - local tax on Maryland taxable income, not state liability
# 2025 resident baseline and local credits source-checked; other profiles unvalidated.
# =============================================================================

# Identity
jurisdiction_id: "US-MD-BAL"
tax_year: 2025

# Metadata
jurisdiction_type: "city"
jurisdiction_name: "Baltimore City"
jurisdiction_abbreviation: "BAL"
parent_jurisdiction_id: "US-MD"
parent_state: "MD"

# Geographic identifiers
fips_code: "2404000"
zip_prefixes:
  - "212"

# Tax characteristics
has_income_tax: true
tax_type: "county_piggyback"
applies_to: "residents_only"

# Effective dates
effective_start_date: "2025-01-01"
effective_end_date: "2025-12-31"

# Rate Schedule - PIGGYBACK TAX
rate_schedule:
  rate_type: "piggyback"
  tax_base: "state_taxable_income"

  piggyback:
    base: "md_taxable_income"
    rate: 0.032

# Filing requirements
filing:
  filing_required: true
  filing_threshold: 0
  form_name: "Included in MD state return"
  collection_agency: "Maryland Comptroller"

# Local-specific configuration
local_config:
  special_notes:
    - "Baltimore City tax is calculated as percentage of MD taxable income"
    - "Baltimore City rate is 3.2% for 2025; Baltimore County is a different jurisdiction"
    - "Supported profile includes separately calculated local EIC and poverty credits"
    - "Filed with Maryland state return, not separately"

# Verification
verification:
  status: "validated_cases_only"
  last_verified: "2026-09-09"
  verified_by: "source-derived repair tests"
  notes: "2025 single age-40 resident profile; rate, base and applicable local credit worksheets."

references:
  - source_name: "Maryland Comptroller"
    url: "https://www.marylandcomptroller.gov/content/dam/mdcomp/tax/instructions/2025/resident-booklet.pdf"
    retrieved_date: "2026-09-09"
    notes: "Instructions 16,18B,19A-C; Baltimore City 3.2%."
