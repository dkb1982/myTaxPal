    url: "https://www.phila.gov/media/20260128151226/2025-School-Income-Tax-SIT-instructions.pdf"
    retrieved_date: "2026-09-09"
  - source_name: "2025 Philadelphia W-2 guide, mid-year wage-rate change"
    url: "https://employee.phila.gov/wp-content/uploads/2026/01/One-Philly-How-to-Navigate-Your-2025-W-2_January-2026_Final-1.pdf"
    retrieved_date: "2026-09-09"
  - source_name: "Philadelphia Department of Revenue"
    url: "https://www.phila.gov/revenue/"
    retrieved_date: "2025-02-20"
    notes: "Philadelphia wage tax rates 2025"
