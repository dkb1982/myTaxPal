# =============================================================================
# Resident single/age-40 cases source-checked for 2025; other profiles unvalidated.
# =============================================================================
# Detroit - City income tax (flat rate, different for residents/non-residents)
# See policy_2025 and repair tests for the bounded validation scope.
# =============================================================================

# Identity
jurisdiction_id: "US-MI-DET"
tax_year: 2025
policy_2025:
  personal_exemption: 600

# Metadata
jurisdiction_type: "city"
jurisdiction_name: "Detroit"
jurisdiction_abbreviation: "DET"
parent_jurisdiction_id: "US-MI"
parent_state: "MI"

# Geographic identifiers
fips_code: "2622000"
zip_prefixes:
  - "482"

# Tax characteristics
has_income_tax: true
tax_type: "city_income_tax"
applies_to: "both_residents_and_workers"

# Effective dates
effective_start_date: "2025-01-01"
effective_end_date: "2025-12-31"

# Rate Schedule - FLAT TAX
# PLACEHOLDER: All rates need verification
rate_schedule:
  rate_type: "flat"
  tax_base: "all_income"

  flat_rates:
    resident_rate: 0.024  # PLACEHOLDER - 2.4%
    nonresident_rate: 0.012  # PLACEHOLDER - 1.2%

# Filing requirements
filing:
  filing_required: true
  filing_threshold: 600  # PLACEHOLDER
  form_name: "D-1040"
  collection_agency: "City of Detroit Income Tax Division"

# Local-specific configuration
local_config:
  withholding_required: true
  employer_withholding: true
  special_notes:
    - "PLACEHOLDER: Detroit has city income tax for residents and workers"
    - "PLACEHOLDER: Resident rate is double non-resident rate"
    - "Resident baseline uses federal AGI less the $600 city personal exemption, not federal taxable income"

# Verification
verification:
  status: "validated_cases_only"
  last_verified: "2026-09-09"
  verified_by: "source-derived repair tests"
  notes: "Resident single/age-40 wages, dividends and personal securities profile only; nonresident calculations unvalidated."

references:
  - source_name: "2025 Detroit resident income tax instructions"
    url: "https://www.michigan.gov/taxes/-/media/Project/Websites/taxes/Forms/City-IIT/TY2025/5313_City-Book.pdf"
    retrieved_date: "2026-09-09"
