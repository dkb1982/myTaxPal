effective_end_date: "2026-12-31"

rate_schedule:
  rate_type: "none"
  flat_rate: null
  brackets: []
  surtaxes: []

# No social insurance for expatriate employees.  NOT MODELLED: GPSSA pension
# for UAE nationals (Federal Decree-Law No. 57 of 2023); the calculator
# assumes an expatriate employee.
social_insurance: null

