    dependent_exemption_available: false
    dependent_exemption_amount: 0

verification:
  status: "verified"
  provisional_items: []
  last_verified: "2026-10-27"
  verified_by: "intl-2026 CA/JP/PT/AE engineer"
  notes: |
    The UAE government portal states "The UAE does not levy income tax on
    individuals" (retrieved 2026-10-27); no personal income tax has been
    enacted for 2026.  Cabinet Decision No. 49 of 2023 limits Corporate Tax
    on natural persons to business/business activity turnover above AED 1
    million; wages and personal investment income are excluded.  GPSSA rates
    for nationals (11% / 5% legacy employee share, AED 70k/month cap) are
    documented in the calculator notes but not modelled or re-verified.

