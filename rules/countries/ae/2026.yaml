# =============================================================================
# UAE (United Arab Emirates) Tax Rules - 2026
# =============================================================================
# The UAE levies NO personal income tax on individuals (employment income,
# personal investment income and non-licensed real estate income).  Natural
# persons are within Corporate Tax only for licensed business activity with
# turnover above AED 1,000,000 in a calendar year (Cabinet Decision No. 49 of
# 2023), which is outside the 2026 day-1 scope (self-employment refused).
# =============================================================================

