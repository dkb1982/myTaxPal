# =============================================================================
# Canada Tax Rules - 2025 Tax Year (calendar year)
# =============================================================================
# Single source of truth for ca.py.  `rate_schedule` = federal brackets; all
# other parameters (credits, CPP/EI, provinces, dividends) are under
# `country_parameters`.  Supported provinces: ON, BC, AB.  QC and all other
# provinces/territories are rejected by the calculator.
# =============================================================================

jurisdiction_id: "CA"
tax_year: 2025
jurisdiction_type: "country"
jurisdiction_name: "Canada"
jurisdiction_abbreviation: "CA"
parent_jurisdiction_id: null

country_code: "CA"
currency_code: "CAD"
tax_year_format: "calendar"

has_income_tax: true
income_tax_type: "graduated"

effective_start_date: "2025-01-01"
effective_end_date: "2025-12-31"

# Federal brackets.  The lowest rate fell from 15% to 14% on 1 July 2025,
# giving a full-year rate of 14.5% for 2025 (CRA).
rate_schedule:
  rate_type: "graduated"
  flat_rate: null
  brackets:
    - {bracket_id: "CA-FED-2025-1", filing_status: "all", income_from: 0, income_to: 57375, rate: 0.145, base_tax: 0}
    - {bracket_id: "CA-FED-2025-2", filing_status: "all", income_from: 57375, income_to: 114750, rate: 0.205, base_tax: 8319.38}
    - {bracket_id: "CA-FED-2025-3", filing_status: "all", income_from: 114750, income_to: 177882, rate: 0.26, base_tax: 20081.25}
    - {bracket_id: "CA-FED-2025-4", filing_status: "all", income_from: 177882, income_to: 253414, rate: 0.29, base_tax: 36495.57}
    - {bracket_id: "CA-FED-2025-5", filing_status: "all", income_from: 253414, income_to: null, rate: 0.33, base_tax: 58399.85}
  surtaxes: []

social_insurance:
  components:
    - component_id: "CA-CPP"
      name: "Canada Pension Plan"
      type: "pension"
      employee_rate: 0.0595
      employer_rate: 0.0595
      ceiling: 71300
      floor: 3500
      notes: "Base 4.95% (credit) + first enhanced 1% (deduction)"
    - component_id: "CA-CPP2"
      name: "Canada Pension Plan (second additional)"
      type: "pension"
      employee_rate: 0.04
      employer_rate: 0.04
      ceiling: 81200
      floor: 71300
      notes: "Deductible"
    - component_id: "CA-EI"
      name: "Employment Insurance"
      type: "unemployment"
      employee_rate: 0.0164
      employer_rate: 0.02296
      ceiling: 65700
      floor: 0
      notes: "EI premiums 2025 (outside Quebec)"
  calculation_method: "percentage"

deductions:
  standard_deduction:
    available: false
    amounts: []
    additional_amounts: []
  exemptions:
    personal_exemption_available: false
    personal_exemption_amount: 0
    dependent_exemption_available: false
    dependent_exemption_amount: 0

country_parameters:
  federal:
    credit_rate: 0.145
    bpa_max: 16129
    bpa_min: 14538
    bpa_phaseout_start: 177882
    bpa_phaseout_end: 253414
    canada_employment_amount: 1471
  # No dividend gross-up / DTC parameters: Compare income_breakdown dividends use
  # US-defined categories and are taxed as foreign dividends (fully taxable, no
  # gross-up or DTC; foreign tax credit not modelled).
  capital_gains_inclusion: 0.5
  cpp:
    ympe: 71300
    yampe: 81200
    basic_exemption: 3500
    base_rate: 0.0495               # employee base part (credit)
    first_enhanced_rate: 0.01       # employee first-enhanced part (deduction)
    cpp2_rate: 0.04
  ei:
    rate: 0.0164
    max_insurable: 65700
  provinces:
    "ON":
      brackets:
        - [0, 52886, 0.0505]
        - [52886, 105775, 0.0915]
        - [105775, 150000, 0.1116]
        - [150000, 220000, 0.1216]
        - [220000, null, 0.1316]
      credit_rate: 0.0505
      bpa: 12747
      surtax:
        - {threshold: 5710, rate: 0.20}
        - {threshold: 7307, rate: 0.36}
      tax_reduction_basic: 294       # x2, minus Ontario tax
      lift:
        max: 875
        rate_on_employment: 0.0505
        threshold: 32500
        reduction_rate: 0.05
      health_premium:                # [from, to, base, rate on excess over from, cap]
        - [0, 20000, 0, 0, 0]
        - [20000, 25000, 0, 0.06, 300]
        - [25000, 36000, 300, 0, 300]
        - [36000, 38500, 300, 0.06, 450]
        - [38500, 48000, 450, 0, 450]
        - [48000, 48600, 450, 0.25, 600]
        - [48600, 72000, 600, 0, 600]
        - [72000, 72600, 600, 0.25, 750]
        - [72600, 200000, 750, 0, 750]
        - [200000, 200600, 750, 0.25, 900]
        - [200600, null, 900, 0, 900]
    "BC":
      brackets:
        - [0, 49279, 0.0506]
        - [49279, 98560, 0.077]
        - [98560, 113158, 0.105]
        - [113158, 137407, 0.1229]
        - [137407, 186306, 0.147]
        - [186306, 259829, 0.168]
        - [259829, null, 0.205]
