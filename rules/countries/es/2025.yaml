# =============================================================================
# Spain Tax Rules - 2025 Tax Year (IRPF, calendar year)
# =============================================================================
# Single source of truth for es.py.  The calculator reads `country_parameters`
# below; `rate_schedule` holds the STATE general scale (LIRPF art. 63.1) only.
# The regional (autonomous-community) half of the general scale is selected
# from `country_parameters.regional_general_scales`.
# =============================================================================

jurisdiction_id: "ES"
tax_year: 2025
jurisdiction_type: "country"
jurisdiction_name: "Spain"
jurisdiction_abbreviation: "ES"
parent_jurisdiction_id: null

country_code: "ES"
currency_code: "EUR"
tax_year_format: "calendar"

has_income_tax: true
income_tax_type: "graduated"

effective_start_date: "2025-01-01"
effective_end_date: "2025-12-31"

# State half of the general scale (LIRPF art. 63.1).  NOT combined.
rate_schedule:
  rate_type: "graduated"
  flat_rate: null
  brackets:
    - {bracket_id: "ES-STATE-2025-1", filing_status: "all", income_from: 0, income_to: 12450, rate: 0.095, base_tax: 0}
    - {bracket_id: "ES-STATE-2025-2", filing_status: "all", income_from: 12450, income_to: 20200, rate: 0.12, base_tax: 1182.75}
    - {bracket_id: "ES-STATE-2025-3", filing_status: "all", income_from: 20200, income_to: 35200, rate: 0.15, base_tax: 2112.75}
    - {bracket_id: "ES-STATE-2025-4", filing_status: "all", income_from: 35200, income_to: 60000, rate: 0.185, base_tax: 4362.75}
    - {bracket_id: "ES-STATE-2025-5", filing_status: "all", income_from: 60000, income_to: 300000, rate: 0.225, base_tax: 8950.75}
    - {bracket_id: "ES-STATE-2025-6", filing_status: "all", income_from: 300000, income_to: null, rate: 0.245, base_tax: 62950.75}
  surtaxes: []

social_insurance:
  components:
    - component_id: "ES-SS-COMMON"
      name: "Seguridad Social (Contingencias comunes)"
      type: "general_social"
      employee_rate: 0.047
      employer_rate: 0.236
      ceiling: 58914
      floor: 0
      notes: "Max base EUR 4,909.50/month x 12 (2025)"
    - component_id: "ES-SS-UNEMPLOYMENT"
      name: "Seguridad Social (Desempleo)"
      type: "unemployment"
      employee_rate: 0.0155
      employer_rate: 0.055
      ceiling: 58914
      floor: 0
      notes: "Indefinite contract"
    - component_id: "ES-SS-TRAINING"
      name: "Formacion Profesional"
      type: "general_social"
      employee_rate: 0.001
      employer_rate: 0.006
      ceiling: 58914
      floor: 0
      notes: ""
    - component_id: "ES-SS-MEI"
      name: "Mecanismo de Equidad Intergeneracional"
      type: "pension"
      employee_rate: 0.0013
      employer_rate: 0.0067
      ceiling: 58914
      floor: 0
      notes: "MEI 0.80% in 2025"
  calculation_method: "percentage"
  employer_contribution: true
  employee_contribution: true

deductions:
  standard_deduction:
    available: false
    amounts: []
    additional_amounts: []
  exemptions:
    personal_exemption_available: true
    personal_exemption_amount: 5550   # Applied as a zero-rate band (arts. 56/63), not a base deduction
    dependent_exemption_available: false
    dependent_exemption_amount: 0

country_parameters:
  social_security:
    annual_max_base: 58914          # 4,909.50 x 12
    employee_rates:
      common: 0.047
      unemployment: 0.0155
      training: 0.001
      mei: 0.0013
    # Cotizacion adicional de solidaridad (salary above max base), 2025 rates.
    # Split employer/employee in the same proportion as common contingencies
    # (23.60 / 4.70), so the employee share is 4.70 / 28.30.
    solidarity:
      employee_share: 0.16607774       # 4.70 / 28.30
      bands:                            # (fraction of max base above it, total rate)
        - {upto_fraction: 0.10, rate: 0.0092}
        - {upto_fraction: 0.50, rate: 0.0100}
        - {upto_fraction: null, rate: 0.0117}

  work_income:
    other_expenses: 2000              # art. 19.2.f "otros gastos"
    # art. 20 reduction; base = gross work income minus art. 19.2 a)-e) expenses
    reduction:
      full_amount: 7302
      full_upto: 14852
      middle_upto: 17673.52
      middle_slope: 1.75
      middle_end_amount: 2364.34
      zero_at: 19747.5
      end_slope: 1.14
      max_other_income: 6500
    # Disposicion adicional 61.a LIRPF (Ley 5/2025): low-wage work deduction
    smi_deduction:
      amount: 340
      full_upto: 16576
      zero_at: 18276
      slope: 0.2
      max_other_income: 6500

  personal_minimum:
    state: 5550
    regional:
      madrid: 5956.65
      generic: 5550

  # Savings base scales (LIRPF arts. 66 and 76), state and regional halves.
  savings_scale_state:
    - [0, 6000, 0.095]
    - [6000, 50000, 0.105]
    - [50000, 200000, 0.115]
    - [200000, 300000, 0.135]
    - [300000, null, 0.15]
  savings_scale_regional:
    - [0, 6000, 0.095]
    - [6000, 50000, 0.105]
    - [50000, 200000, 0.115]
    - [200000, 300000, 0.135]
    - [300000, null, 0.15]

  regional_general_scales:
    # Comunidad de Madrid (Texto Refundido DLeg 1/2010 art. 1, as amended
    # by Ley 8/2022 and Ley 11/2022).  Published by the Comunidad de Madrid.
    madrid:
      - [0, 13362.22, 0.085]
      - [13362.22, 19004.63, 0.107]
      - [19004.63, 35425.68, 0.128]
      - [35425.68, 57320.40, 0.174]
      - [57320.40, null, 0.205]
    # GENERIC fallback for other common-regime communities: mirrors the state
    # scale.  This is an approximation, flagged with a warning at runtime.
    generic:
      - [0, 12450, 0.095]
      - [12450, 20200, 0.12]
      - [20200, 35200, 0.15]
      - [35200, 60000, 0.185]
      - [60000, 300000, 0.225]
      - [300000, null, 0.245]

  common_regime_communities:
    - andalucia
    - aragon
    - asturias
    - baleares
    - canarias
    - cantabria
    - castilla_la_mancha
    - castilla_y_leon
    - cataluna
    - extremadura
    - galicia
    - madrid
    - murcia
    - la_rioja
    - valencia
  foral_or_special:
    - pais_vasco
    - navarra
    - ceuta
    - melilla

verification:
  status: "verified"
  last_verified: "2026-10-23"
  verified_by: "eu-b engineer (primary sources below)"
  notes: >-
    Verified: state general scale, savings scales, work reduction and its base
    (AEAT manual 2025 7.1.6), DA 61a deduction (Ley 5/2025), Madrid minimum
    EUR 5,956.65 (AEAT manual 2025), Madrid scale (Comunidad de Madrid page,
    labelled 2024; no 2025 change found - announced cut targets 2027).
    SS 2025 max base and employee rates per Seguridad Social; solidarity band
    rates 0.92/1.00/1.17% are from the 2025 Orden de cotizacion (not fetched).
    Communities other than Madrid use a GENERIC state-mirror scale (approximate).

