    retrieved_date: "2026-10-23"
  - source_name: "AEAT Manual IRPF 2025 - Madrid minimo personal y familiar"
    url: "https://sede.agenciatributaria.gob.es/Sede/en_gb/ayuda/manuales-videos-folletos/manuales-practicos/irpf-2025/c14-adecuacion-impuesto-circunstancias-personales/minimo-autonomico-personal-familiar/comunidad-madrid-importes-minimo-personal-familiar.html"
    retrieved_date: "2026-10-23"
