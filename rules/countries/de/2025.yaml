# =============================================================================
# Germany Tax Rules - 2025 Tax Year (Veranlagungszeitraum 2025)
# =============================================================================
# Single source of truth for src/tax_estimator/calculation/countries/de.py.
# The calculator raises if a required key below is missing; it has no
# hard-coded fallback rates.
#
# German Tax Year: January 1 to December 31
# =============================================================================

# Identity
jurisdiction_id: "DE"
tax_year: 2025

# Metadata
jurisdiction_type: "country"
jurisdiction_name: "Germany"
jurisdiction_abbreviation: "DE"
parent_jurisdiction_id: null

# International extensions
country_code: "DE"
currency_code: "EUR"
tax_year_format: "calendar"

# Tax characteristics
has_income_tax: true
income_tax_type: "formula"

# Effective dates
effective_start_date: "2025-01-01"
effective_end_date: "2025-12-31"

# -----------------------------------------------------------------------------
# Einkommensteuertarif §32a Abs. 1 EStG, version in force for VZ 2025
# (Steuerfortentwicklungsgesetz). zvE and the resulting tax are rounded down to
# full euros. Zone upper bounds are inclusive.
#   zone 2: (a*y + b)*y,           y = (zvE - 12,096) / 10,000
#   zone 3: (a*z + b)*z + c,       z = (zvE - 17,443) / 10,000
#   zone 4/5: rate*x - c
# Verified 2026-10-23 against buzer.de consolidated text (Fassung ab 01.01.2025).
# -----------------------------------------------------------------------------
income_tax_formula:
  grundfreibetrag: 12096
  zone2_upper: 17443
  zone2_a: 932.30
  zone2_b: 1400
  zone3_upper: 68480
  zone3_a: 176.64
  zone3_b: 2397
  zone3_c: 1015.13
  zone4_upper: 277825
  zone4_rate: 0.42
  zone4_c: 10911.92
  zone5_rate: 0.45
  zone5_c: 19246.67

# Solidaritaetszuschlag (SolZG 1995 §3 Abs. 3, §4), VZ 2025.
# Freigrenze applies to tariff income tax (excluding §32d capital tax).
# Above it, Soli = min(5.5% x ESt, 11.9% x (ESt - Freigrenze)).
# Soli on Abgeltungsteuer is 5.5% with no Freigrenze (withholding).
solidarity_surcharge:
  rate: 0.055
  freigrenze_single: 19950
  freigrenze_joint: 39900
  milderung_rate: 0.119

# Kirchensteuer: 8% in Bavaria and Baden-Wuerttemberg, 9% elsewhere.
church_tax:
  rate_standard: 0.09
  rate_reduced: 0.08
  reduced_rate_states: ["by", "bw", "bayern", "bavaria", "baden-wuerttemberg", "baden-württemberg"]

# -----------------------------------------------------------------------------
# Social insurance 2025 (employee shares)
# Sources: Sozialversicherungsrechengroessen-Verordnung 2025 (BBG);
#          BMG Bekanntmachung durchschnittlicher Zusatzbeitragssatz 2025 = 2.5%;
#          Pflegeversicherung 3.6% from 2025-01-01 (Beitragssatzanpassungsverordnung 2025).
# -----------------------------------------------------------------------------
social_insurance:
  pension_rate_employee: 0.093          # RV 18.6% total
  unemployment_rate_employee: 0.013     # AV 2.6% total
  pension_ceiling: 96600                # BBG RV/AV 2025 (unified east/west)
  health_rate_employee: 0.073           # KV general 14.6% total
  health_zusatzbeitrag_avg: 0.025       # average Zusatzbeitrag 2025; employee pays half
  health_ceiling: 66150                 # BBG KV/PV 2025
  care_rate_employee: 0.018             # PV 3.6% total, half each
  care_rate_employee_saxony: 0.023      # Saxony: employer 1.3%, employee 2.3%
  care_childless_surcharge: 0.006       # childless aged 23+
  care_child_reduction: 0.0025          # per child from the 2nd to the 5th (children under 25)
  care_child_reduction_max_children: 5
  saxony_states: ["sn", "sachsen", "saxony"]

# -----------------------------------------------------------------------------
# Deductions used for the zvE of an employee (annual assessment view)
# -----------------------------------------------------------------------------
deductions:
  arbeitnehmer_pauschbetrag: 1230       # §9a Satz 1 Nr. 1a EStG (capped at employment income)
  sonderausgaben_pauschbetrag_single: 36  # §10c EStG
  sonderausgaben_pauschbetrag_joint: 72
  # Basic health insurance deductible as Vorsorgeaufwendungen is reduced by 4%
  # where the contract includes Krankengeld (§10 Abs. 1 Nr. 3 Buchst. a Satz 4 EStG).
  health_krankengeld_reduction: 0.04
  # Altersvorsorgeaufwendungen cap 2025 (§10 Abs. 3 EStG; never binding below BBG).
  altersvorsorge_cap_single: 29344
  entlastungsbetrag_alleinerziehende: 4260      # §24b EStG, tax class II
  entlastungsbetrag_additional_child: 240

# Abgeltungsteuer §32d / §20 Abs. 9 EStG
capital_income:
  rate: 0.25
  sparer_pauschbetrag_single: 1000
  sparer_pauschbetrag_joint: 2000

# Legacy schema block retained for tooling that expects rate_schedule; the
# calculator uses income_tax_formula above, not these marginal-rate markers.
rate_schedule:
  rate_type: "graduated"
  flat_rate: null
  brackets:
    - {bracket_id: "DE-2025-0", filing_status: "all", income_from: 0, income_to: 12096, rate: 0.00, base_tax: 0}
    - {bracket_id: "DE-2025-P1", filing_status: "all", income_from: 12096, income_to: 17443, rate: 0.14, base_tax: 0}
    - {bracket_id: "DE-2025-P2", filing_status: "all", income_from: 17443, income_to: 68480, rate: 0.2397, base_tax: 1015}
    - {bracket_id: "DE-2025-42", filing_status: "all", income_from: 68480, income_to: 277825, rate: 0.42, base_tax: 17849}
    - {bracket_id: "DE-2025-45", filing_status: "all", income_from: 277825, income_to: null, rate: 0.45, base_tax: 105774}
  surtaxes: []

# Verification
verification:
  status: "verified"
  last_verified: "2026-10-23"
  verified_by: "eu-a tax engineer (hand calculation from statute)"
  notes: >-
    Verified: §32a tariff constants 2025; Soli Freigrenze 19,950/39,900 and 11.9%
    Milderung; employee SV rates and BBGs 2025; Pauschbetraege. Not modelled:
    Kinderfreibetrag/Kindergeld Guenstigerpruefung, Guenstigerpruefung for capital
    income (§32d Abs. 6), church-tax deduction as Sonderausgabe, tax class V/VI
    withholding, private health insurance, self-employment.

references:
  - source_name: "§32a EStG, Fassung ab 01.01.2025 (consolidated)"
    url: "https://www.buzer.de/gesetz/4499/al210146-0.htm"
    retrieved_date: "2026-10-23"
  - source_name: "§32a EStG current (2026) text, for comparison"
    url: "https://www.gesetze-im-internet.de/estg/__32a.html"
    retrieved_date: "2026-10-23"
  - source_name: "SolZG 1995 §3 / §4"
    url: "https://www.gesetze-im-internet.de/solzg_1995/BJNR097500993.html"
    retrieved_date: "2026-10-23"
  - source_name: "Sozialversicherungsrechengroessen 2025 (BMAS)"
    url: "https://www.bmas.de/DE/Service/Presse/Pressemitteilungen/2024/sozialversicherungsrechengroessen-2025.html"
    retrieved_date: "2026-10-23"
    notes: "BBG 96,600 / 66,150 from secondary confirmation; page not fetched directly."
