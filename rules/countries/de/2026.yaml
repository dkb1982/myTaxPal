# =============================================================================
# Germany Tax Rules - 2026 Tax Year (Veranlagungszeitraum 2026)
# =============================================================================
# Single source of truth for src/tax_estimator/calculation/countries/de.py.
# Same structure as 2025.yaml. The calculator raises if a required key is
# missing; it has no hard-coded fallback rates.
#
# 2026 scope (day 1): single employee without children (tax class I or VI).
# Married classes III/IV/V, class II and children are refused for 2026.
#
# German Tax Year: January 1 to December 31
# =============================================================================

# Identity
jurisdiction_id: "DE"
tax_year: 2026

# Metadata
jurisdiction_type: "country"
jurisdiction_name: "Germany"
jurisdiction_abbreviation: "DE"
parent_jurisdiction_id: null

# International extensions
country_code: "DE"
currency_code: "EUR"
tax_year_format: "calendar"
period_label: "Calendar 2026"

# Tax characteristics
has_income_tax: true
income_tax_type: "formula"

# Effective dates
effective_start_date: "2026-01-01"
effective_end_date: "2026-12-31"

# -----------------------------------------------------------------------------
# Einkommensteuertarif §32a Abs. 1 EStG "ab dem Veranlagungszeitraum 2026"
# (Steuerfortentwicklungsgesetz, BGBl. 2024 I Nr. 449). zvE and tax are rounded
# down to full euros. Zone upper bounds are inclusive.
#   zone 2 (12,349..17,799): (914.51*y + 1,400)*y,        y = (zvE - 12,348)/10,000
#   zone 3 (17,800..69,878): (173.10*z + 2,397)*z + 1,034.87, z = (zvE - 17,799)/10,000
#   zone 4 (69,879..277,825): 0.42*x - 11,135.63
#   zone 5 (from 277,826):    0.45*x - 19,470.38
# Verified 2026-10-27 against gesetze-im-internet.de (current text, VZ 2026).
# -----------------------------------------------------------------------------
income_tax_formula:
  grundfreibetrag: 12348
  zone2_upper: 17799
  zone2_a: 914.51
  zone2_b: 1400
  zone3_upper: 69878
  zone3_a: 173.10
  zone3_b: 2397
  zone3_c: 1034.87
  zone4_upper: 277825
  zone4_rate: 0.42
  zone4_c: 11135.63
  zone5_rate: 0.45
  zone5_c: 19470.38

# Solidaritaetszuschlag: SolZG 1995 §3 Abs. 3 in the version of Art. 4 of the
# law of 23.12.2024 (BGBl. 2024 I Nr. 449), first applied for VZ 2026 per §6
# Abs. 27 SolZG: Freigrenze 20,350 (single) / 40,700 (splitting).
solidarity_surcharge:
  rate: 0.055
  freigrenze_single: 20350
  freigrenze_joint: 40700
  milderung_rate: 0.119

# Kirchensteuer: 8% in Bavaria and Baden-Wuerttemberg, 9% elsewhere (unchanged).
church_tax:
  rate_standard: 0.09
  rate_reduced: 0.08
  reduced_rate_states: ["by", "bw", "bayern", "bavaria", "baden-wuerttemberg", "baden-württemberg"]

# -----------------------------------------------------------------------------
# Social insurance 2026 (employee shares)
#   BBG: Sozialversicherungsrechengroessen-Verordnung 2026 (BGBl. 26.11.2025):
#        RV/AV 101,400 (§4); KV/PV 69,750.
#   Average Zusatzbeitrag 2026 = 2.9% (BMG Bekanntmachung nach §242a Abs. 2
#        SGB V vom 7.11.2025, BAnz AT 10.11.2025 B7).
#   RV 18.6%, AV 2.6%, KV 14.6%, PV 3.6% (+0.6% childless) unchanged for 2026.
# -----------------------------------------------------------------------------
social_insurance:
  pension_rate_employee: 0.093          # RV 18.6% total
  unemployment_rate_employee: 0.013     # AV 2.6% total
  pension_ceiling: 101400               # BBG RV/AV 2026 (allgemeine RV)
  health_rate_employee: 0.073           # KV general 14.6% total
  health_zusatzbeitrag_avg: 0.029       # average Zusatzbeitrag 2026; employee pays half
  health_ceiling: 69750                 # BBG KV/PV 2026
  care_rate_employee: 0.018             # PV 3.6% total, half each
  care_rate_employee_saxony: 0.023      # Saxony: employer 1.3%, employee 2.3% (§58 Abs. 3 SGB XI)
  care_childless_surcharge: 0.006       # childless aged 23+
  care_child_reduction: 0.0025          # per child from the 2nd to the 5th (children under 25)
  care_child_reduction_max_children: 5
  saxony_states: ["sn", "sachsen", "saxony"]

# -----------------------------------------------------------------------------
# Deductions used for the zvE of an employee (annual assessment view)
# -----------------------------------------------------------------------------
deductions:
  arbeitnehmer_pauschbetrag: 1230       # §9a Satz 1 Nr. 1a EStG (unchanged)
  sonderausgaben_pauschbetrag_single: 36  # §10c EStG
  sonderausgaben_pauschbetrag_joint: 72
  health_krankengeld_reduction: 0.04    # §10 Abs. 1 Nr. 3 Buchst. a Satz 4 EStG
  # Altersvorsorgeaufwendungen cap 2026 = Hoechstbeitrag knappschaftliche RV
  # (124,800 x 24.7% = 30,825.60, rounded up); never binding below the BBG.
  altersvorsorge_cap_single: 30826
  sonstige_vorsorge_cap_employee: 1900  # §10 Abs. 4 Satz 2 EStG
  entlastungsbetrag_alleinerziehende: 4260      # §24b EStG (class II; refused for 2026)
  entlastungsbetrag_additional_child: 240

# Abgeltungsteuer §32d / §20 Abs. 9 EStG (unchanged)
capital_income:
  rate: 0.25
  sparer_pauschbetrag_single: 1000
  sparer_pauschbetrag_joint: 2000

# Legacy schema block retained for tooling that expects rate_schedule; the
# calculator uses income_tax_formula above, not these marginal-rate markers.
rate_schedule:
  rate_type: "graduated"
  flat_rate: null
  brackets:
    - {bracket_id: "DE-2026-0", filing_status: "all", income_from: 0, income_to: 12348, rate: 0.00, base_tax: 0}
    - {bracket_id: "DE-2026-P1", filing_status: "all", income_from: 12348, income_to: 17799, rate: 0.14, base_tax: 0}
    - {bracket_id: "DE-2026-P2", filing_status: "all", income_from: 17799, income_to: 69878, rate: 0.2397, base_tax: 1034}
    - {bracket_id: "DE-2026-42", filing_status: "all", income_from: 69878, income_to: 277825, rate: 0.42, base_tax: 18213}
    - {bracket_id: "DE-2026-45", filing_status: "all", income_from: 277825, income_to: null, rate: 0.45, base_tax: 105550}
  surtaxes: []

# Verification
verification:
  status: "verified"
  provisional_items: []
  last_verified: "2026-10-27"
  verified_by: "eu-b tax engineer (hand calculation from statute)"
  notes: >-
    Verified: §32a tariff constants VZ 2026 and Soli Freigrenze 20,350 (statute text);
    BBG 101,400 / 69,750 (SVBezGrV 2026); average Zusatzbeitrag 2.9% (BMG
    Bekanntmachung); unchanged RV/AV/KV/PV rates (TK contribution table 2026);
    Arbeitnehmer-Pauschbetrag 1,230 and Sparer-Pauschbetrag 1,000 (statute text).
    Altersvorsorge cap 30,826 from DRV (non-binding for employees). Not modelled:
    Kinderfreibetrag/Kindergeld, Guenstigerpruefung (§32d Abs. 6), church tax as
    Sonderausgabe, private health insurance, self-employment, joint assessment.

