verification:
  status: "verified"
  last_verified: "2026-10-23"
  verified_by: "engineering (primary-source check)"
  notes: |
    Verified: income tax brackets, reconstruction tax, 2025 employment income
    deduction, 2025 basic deduction tiers, 58万 spouse/dependent income limit,
    resident tax basic deduction 43万 and 110万 non-taxable salary line,
    Kyokai Tokyo health 9.91% and care 1.59%, employment insurance 5.5/1000.
    Unverified against a primary source in this pass: the 標準報酬月額 grade
    boundaries (standard Kyokai table reproduced from memory) and the
    resident-tax non-taxable formula, which varies by municipality class.
    Not modelled: spouse special deduction, specific/elderly dependents,
    所得金額調整控除, iDeCo/life-insurance deductions, furusato nozei.

