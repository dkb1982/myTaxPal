verification:
  status: "verified"
  provisional_items: []
  last_verified: "2026-10-27"
  verified_by: "intl-2026 CA/JP/PT/AE engineer (primary-source check)"
  notes: |
    Verified (NTA 令和8年分 年末調整のしかた and 令和8年度改正 Q&A, May 2026):
    basic deduction 104万/67万/62万 tiers, employment income deduction minimum
    74万 and the 2,191,000-2,199,999 fixed rows, 2.1% reconstruction surtax
    (102.1%), unchanged rate table. Resident tax 令和9年度: employment income
    change applies, basic deduction unchanged at 43万 (Sendai/Chuo city
    notices; non-taxable salary line 110万 -> 119万 follows from the 45万
    total-income line). Kyokai Kenpo Tokyo 令和8年度 health 9.85%, care 1.62%,
    child support levy 0.23% (from April 2026). Employment insurance 令和8年度
    5/1000 employee (MHLW Yamagata labour bureau). Pension 18.3% and the
    standard remuneration grades/caps are unchanged in 2026 (the pension cap
    rise to ¥680k starts September 2027).
    Simplifications kept from 2025: fiscal-year rates applied to all months,
    Tokyo rates regardless of prefecture, 標準報酬月額 boundaries reproduced
    from the standard table. 2026 scope: single, no dependants, employee;
    spouse/dependants/business income are refused.

