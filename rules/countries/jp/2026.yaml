    - [280000, 270000]
    - [300000, 290000]
    - [320000, 310000]
    - [340000, 330000]
    - [360000, 350000]
    - [380000, 370000]
    - [410000, 395000]
    - [440000, 425000]
    - [470000, 455000]
    - [500000, 485000]
    - [530000, 515000]
    - [560000, 545000]
    - [590000, 575000]
