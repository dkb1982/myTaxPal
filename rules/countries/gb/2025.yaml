# =============================================================================
# United Kingdom (UK) Tax Rules - 2025-26 Tax Year
# =============================================================================
# UK Tax Year: April 6, 2025 to April 5, 2026
# Source: gov.uk (HMRC)
# =============================================================================

# Identity
jurisdiction_id: "GB"
tax_year: 2025

# Metadata
jurisdiction_type: "country"
jurisdiction_name: "United Kingdom"
jurisdiction_abbreviation: "UK"
parent_jurisdiction_id: null

# International extensions
country_code: "GB"
currency_code: "GBP"
tax_year_format: "uk_fiscal"
period_label: "2025/26 tax year (6 April 2025 to 5 April 2026)"

# Tax characteristics
has_income_tax: true
income_tax_type: "graduated"

# Effective dates (UK fiscal year)
effective_start_date: "2025-04-06"
effective_end_date: "2026-04-05"

# Income Tax Rate Schedule - England/Wales/NI (2025-26)
rate_schedule:
  rate_type: "graduated"
  flat_rate: null
  brackets:
    # Coordinates are taxable income after allowances, not gross income.
    - bracket_id: "GB-2025-BASIC"
      filing_status: "all"
      income_from: 0
      income_to: 37700
      rate: 0.20
      base_tax: 0
    - bracket_id: "GB-2025-HIGHER"
      filing_status: "all"
      income_from: 37700
      income_to: 125140
      rate: 0.40
      base_tax: 7540  # 37700 * 0.20
    - bracket_id: "GB-2025-ADDITIONAL"
      filing_status: "all"
      income_from: 125140
      income_to: null
      rate: 0.45
      base_tax: 37488  # 7540 + (125140-50270) * 0.40 = 7540 + 29948 = 37488
  surtaxes: []

# Scotland Income Tax Brackets (2025-26)
# Scotland has separate tax bands
scotland_brackets:
  - bracket_id: "GB-2025-SCOTLAND-STARTER"
    filing_status: "all"
    income_from: 0
    income_to: 2827
    rate: 0.19
    base_tax: 0
  - bracket_id: "GB-2025-SCOTLAND-BASIC"
    filing_status: "all"
    income_from: 2827
    income_to: 14921
    rate: 0.20
    base_tax: 537.13
  - bracket_id: "GB-2025-SCOTLAND-INTERMEDIATE"
    filing_status: "all"
    income_from: 14921
    income_to: 31092
    rate: 0.21
    base_tax: 2955.93
  - bracket_id: "GB-2025-SCOTLAND-HIGHER"
    filing_status: "all"
    income_from: 31092
    income_to: 62430
    rate: 0.42
    base_tax: 6351.84
  - bracket_id: "GB-2025-SCOTLAND-ADVANCED"
    filing_status: "all"
    income_from: 62430
    income_to: 125140
    rate: 0.45
    base_tax: 19513.80
  - bracket_id: "GB-2025-SCOTLAND-TOP"
    filing_status: "all"
    income_from: 125140
    income_to: null
    rate: 0.48
    base_tax: 47733.30

# Personal Allowance Taper (2025-26)
personal_allowance_taper:
  base_amount: 12570
  taper_threshold: 100000
  taper_rate: 0.5
  minimum: 0

# National Insurance Class 1 (2025-26)
# Employee (Primary) and Employer (Secondary) contributions
social_insurance:
  components:
    - component_id: "GB-NI-CLASS1-EMPLOYEE"
      name: "National Insurance Class 1 (Employee)"
      type: "general_social"
      employee_rate: 0.08
      employer_rate: null
      primary_threshold: 12570
      upper_limit: 50270
      additional_rate: 0.02
      notes: "8% on earnings £12,570 to £50,270, then 2% above £50,270"
    - component_id: "GB-NI-CLASS1-EMPLOYER"
      name: "National Insurance Class 1 (Employer)"
      type: "employer_social"
      employee_rate: null
      employer_rate: 0.15
      secondary_threshold: 5000
      notes: "15% on earnings above £5,000 (Secondary Threshold)"
  calculation_method: "banded"
  employer_contribution: true
  employee_contribution: true
  class_4:
    lower_profits_limit: 12570
    upper_profits_limit: 50270
    main_rate: 0.06
    additional_rate: 0.02
    notes: "Annualised estimate: 6% on profits £12,570 to £50,270, then 2% above"

# Student Loan Repayment Thresholds (2025-26)
student_loan_plans:
  - plan_id: "plan_1"
    name: "Plan 1 (pre-2012)"
    threshold: 26065
    rate: 0.09
  - plan_id: "plan_2"
    name: "Plan 2 (post-2012)"
    threshold: 28470
    rate: 0.09
  - plan_id: "plan_4"
    name: "Plan 4 (Scotland)"
    threshold: 32745
    rate: 0.09
  - plan_id: "plan_5"
    name: "Plan 5 (post-2023)"
    threshold: 25000
    rate: 0.09
  - plan_id: "postgrad"
    name: "Postgraduate Loan"
    threshold: 21000
    rate: 0.06

# Capital Gains Tax (2025-26)
capital_gains:
  annual_exempt_amount: 3000
  basic_rate: 0.18
  higher_rate: 0.24

# Savings income (ITA 2007 ss 7, 12, 12B) - 2025-26
savings:
  starting_rate_limit: 5000        # 0% starting rate; reduced by non-savings taxable income
  personal_savings_allowance:
    basic: 1000
    higher: 500                    # additional-rate taxpayers: nil
  rates:
    basic: 0.20
    higher: 0.40
    additional: 0.45

# Dividend income (ITA 2007 ss 8, 13A) - 2025-26
dividends:
  allowance: 500
  rates:
    ordinary: 0.0875
    upper: 0.3375
    additional: 0.3935

# Relief-at-source pensions: payments above the annual allowance are rejected
pension:
  annual_allowance: 60000

# Deductions
deductions:
  standard_deduction:
    available: false
    amounts: []
    additional_amounts: []
  exemptions:
    personal_exemption_available: false
    personal_exemption_amount: 0
    dependent_exemption_available: false
    dependent_exemption_amount: 0

# Verification
verification:
  status: "checked_against_primary_sources"
  last_verified: "2026-09-09"
  notes: "Parameters checked against the cited HMRC and Scottish Government publications; supported scenarios are covered by regression tests."

references:
  - source_name: "gov.uk - Income Tax rates"
    url: "https://www.gov.uk/government/publications/rates-and-allowances-income-tax/income-tax-rates-and-allowances-current-and-past"
    retrieved_date: "2026-09-09"
  - source_name: "gov.scot - Scottish Income Tax 2025 to 2026"
    url: "https://www.gov.scot/publications/scottish-income-tax-2025-2026-factsheet/pages/2/"
    retrieved_date: "2026-09-09"
  - source_name: "gov.uk - National Insurance rates"
    url: "https://www.gov.uk/government/publications/rates-and-allowances-national-insurance-contributions/rates-and-allowances-national-insurance-contributions"
    retrieved_date: "2026-09-09"
  - source_name: "gov.uk - Student Loan repayment"
    url: "https://www.gov.uk/repaying-your-student-loan/what-you-pay"
    retrieved_date: "2026-09-09"
  - source_name: "gov.uk - Adjusted net income"
    url: "https://www.gov.uk/guidance/adjusted-net-income"
    retrieved_date: "2026-09-09"
  - source_name: "gov.uk - Capital Gains Tax rates and allowances"
    url: "https://www.gov.uk/guidance/capital-gains-tax-rates-and-allowances"
    retrieved_date: "2026-09-09"
