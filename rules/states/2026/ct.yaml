  reciprocity_states: []
  special_notes:
    - "Connecticut 2026 single rates run from 2% to 6.99% (CT-1040ES 2026 Table B)."
    - "Connecticut recaptures the benefit of lower brackets above $56,500 and $105,000 of AGI (single) and phases out the personal exemption and personal tax credit."

verification:
