  verified_by: "source review (agent); not professional sign-off"
  notes: "All 2026 single-filer amounts taken from DRS Form CT-1040ES (Rev. 01/26) Tables A-E; identical to 2025. No 2026 enacted rate or surcharge change found (2026 capital-gains surcharge and top-rate bills were proposals only). EITC 40% of federal (CGS 12-704e)."

