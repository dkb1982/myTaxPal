# Connecticut individual income-tax rule for the narrow 2026 US estimator profile
# (single, age 40, full-year resident, W-2 wages, dividends and capital gains).
# Brackets are CT-1040ES 2026 Table B (single). The policy
# (policies_2026_g1._ct) applies Table A (personal exemption), Table C (2%
# phase-out add-back), Table D (recapture) and Table E (personal tax credit).

jurisdiction_id: "US-CT"
tax_year: 2026

jurisdiction_type: "state"
jurisdiction_name: "Connecticut"
jurisdiction_abbreviation: "CT"
parent_jurisdiction_id: "US"

