    retrieved_date: "2026-10-23"
    notes: "Single: 1.5% to $5,500; $82.50+3.2% to $16,500; $434.50+4.3% to $33,500; $1,165.50+4.7% to $66,500; $2,716.50+4.9% to $210,000; $9,748+5.9% above; no indexing clause."
  - source_name: "NM TRD 2025 PIT-1 instructions"
    url: "https://realfile.tax.newmexico.gov/2025pit-1-ins.pdf"
    retrieved_date: "2026-10-23"
    notes: "Line 18 use rate tables; capital gain deduction up to $2,500; low/middle income exemption worksheet ($36,667 single, $20,000, 0.15, $2,500)."
  - source_name: "NM TRD 2025 PIT-1 tax rate table"
    url: "https://realfile.tax.newmexico.gov/2025trt.pdf"
    retrieved_date: "2026-10-23"
    notes: "$100 bands to $100,000 at midpoint tax; above $100,000 TRD prints single $4,356 + 4.9% (statute gives $4,358) - statute used here."
  - source_name: "NM Senate: 2026 tax package (SB 151)"
    url: "https://www.nmsenate.com/senate-tax-committee-passes-comprehensive-tax-package-bill/"
    retrieved_date: "2026-10-23"
    notes: "2026 omnibus changed corporate income tax/GRT/credits; no personal income tax rate or deduction change."
