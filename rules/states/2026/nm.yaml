  reciprocity_states: []
  special_notes:
    - "NMSA 7-2-7 (Laws 2024 ch. 67) rates for taxable years beginning on or after Jan 1 2025; brackets are not indexed."
    - "Starting point: federal AGI less the federal standard deduction ($16,100 for 2026); no QBI line."
    - "Net capital gain deduction up to $2,500 (NMSA 7-2-34); low/middle-income exemption $2,500 phased out 15% above $20,000 AGI, none above $36,667 (NMSA 7-2-5.8)."
    - "PIT-1 tax rate table ($100 bands, midpoint, whole dollars) at or below $100,000 taxable income; statutory schedule above."
    - "Working Families Tax Credit is 25% of the federal EIC; refundable."

verification:
  status: "verified"
  last_verified: "2026-10-23"
  verified_by: "source review (group 4)"
  notes: "Statutory rates from TRD 'Personal Income Tax Rates for Tax Years Starting 2025' (NBER mirror; tax.newmexico.gov serves it dynamically); PIT-1 2025 instructions and 2025 tax rate table for method; 2026 session SB 151 changed only corporate/business items."

references:
  - source_name: "NM TRD: Personal income tax rates 2005-2025 (7-2-7 text, Laws 2024 ch. 67 s. 5)"
