  special_notes:
    - "Ohio 2026 nonbusiness income tax: none if Ohio AGI less exemptions is $26,050 or less; otherwise $332 plus 2.75% of the excess over $26,050 (R.C. 5747.02(A)(3)(c), H.B. 96)."
    - "Personal exemption $2,400 (MAGI <= $40,000), $2,150 (<= $80,000), $1,900 above, and none at MAGI of $500,000 or more (R.C. 5747.025; indexing suspended for 2025-2026 by H.B. 96 Section 757.120(A)). YAML carries the $1,900 tier; the policy selects the tier."
    - "$20 exemption credit when MAGI less exemptions is under $30,000 (R.C. 5747.022)."
    - "Municipal and school-district income taxes are separate."

