# =============================================================================
# Pennsylvania - Flat tax state (3.07%) - Plus extensive local taxes
# =============================================================================

# Identity
jurisdiction_id: "US-PA"
tax_year: 2025

# Metadata
jurisdiction_type: "state"
jurisdiction_name: "Pennsylvania"
jurisdiction_abbreviation: "PA"
parent_jurisdiction_id: "US"

# Tax characteristics
has_income_tax: true
income_tax_type: "flat"

# Effective dates
effective_start_date: "2025-01-01"
effective_end_date: "2025-12-31"

# Rate Schedule - FLAT TAX
# PLACEHOLDER: Pennsylvania flat 3.07% rate
rate_schedule:
  rate_type: "flat"
  flat_rate: 0.0307
  brackets: []
  surtaxes: []

# Deductions - Pennsylvania has NO standard deduction
deductions:
  standard_deduction:
    available: false
    amounts: []
    additional_amounts: []
  exemptions:
    personal_exemption_available: false
    personal_exemption_amount: 0
    dependent_exemption_available: false
    dependent_exemption_amount: 0

# State-specific configuration
state_config:
  starting_point: "state_defined"  # PA uses 8 classes of income
  tax_base_description: "Pennsylvania uses 8 classes of income, each taxed at 3.07%"
  has_local_income_tax: true
  local_tax_mandatory: true  # Most PA residents must pay local EIT
  reciprocity_states:
    - "IN"   # Indiana
    - "MD"   # Maryland
    - "NJ"   # New Jersey
    - "OH"   # Ohio
    - "VA"   # Virginia
    - "WV"   # West Virginia
  income_classes:
    - "Compensation (wages, salaries)"
    - "Net profits (self-employment)"
    - "Net gains from sale of property"
    - "Interest"
    - "Dividends"
    - "Rents and royalties"
    - "Estate or trust income"
    - "Gambling and lottery winnings"
  special_notes:
    - "Pennsylvania taxes eight separate income classes at 3.07%; losses may not offset other classes"
    - "Local Earned Income Tax applies in many municipalities"
    - "Philadelphia has special wage and school income taxes"
    - "PLACEHOLDER: Retirement income is generally exempt"
    - "IMPORTANT: PA does NOT follow federal income definitions"

# Verification
verification:
  status: "verified"
  last_verified: "2026-09-09"
  verified_by: "source-reviewed repair"
  notes: "2025 PIT rate and separate-class baseline source-reviewed"

references:
  - source_name: "Pennsylvania Department of Revenue"
    url: "https://revenue.pa.gov/TaxTypes/PIT/Pages/default.aspx"
    retrieved_date: "2026-09-09"
    notes: "2025 3.07% PIT and separate income classes"
